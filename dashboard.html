<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budgettracker</title>
    <link rel="stylesheet" href="src/budgetstyle.css">
    <meta name="google" content="notranslate">
</head>
<body>
    <main id="main">
        <h1 class="header">Budget-tracker</h1>
    <div class="wrap">
    <div class="content">
        <hr style="width:100%;margin:20px 0;">
<h2 class="content-header">Budget Dashboard</h2>
<div id="balanceCard" class="balance-card balance-green">
<div>Remaining Budget</div>
<div class="balance-value">
<span id="remainingDisplay">0</span> €
</div>
</div>
<div class="budget-grid">
<input id="budgetInput" class="budget-input" type="number" placeholder="Set Budget">
<button class="btn md color-blue" onclick="setBudget()">Set Budget</button>
<h3>Budget: <span id="budgetDisplay">0</span> €</h3>
<h3>Einnahmen: <span id="incomeDisplay">0</span> €</h3>
<h3>Ausgaben: <span id="expenseDisplay">0</span> €</h3>
<h2>Verbleibend: <span id="remainingDisplay2">0</span> €</h2>
<hr style="width:100%">
<h3>Einnahme hinzufügen</h3>
<input id="incomeInput" class="budget-input" type="number" placeholder="Income amount">
<input id="incomeSource" class="budget-input" type="text" placeholder="Source (optional)">
<button class="btn sm color-green" onclick="addIncome()">Add Income</button>
<hr style="width:100%">
<h3>Ausgabe hinzufügen</h3>
<input id="expenseInput" class="budget-input" type="number" placeholder="Expense amount">
<input id="expensePlace" class="budget-input" type="text" placeholder="Where spent? (optional)">
<button class="btn sm color-red" onclick="addExpense()">Add Expense</button>
<button class="btn sm color-black" onclick="resetBudget()">Reset</button>
</div>
<hr style="width:100%;margin-top:30px">
<h2 class="content-header">Transaktionsverlauf</h2>
<div class="history-box">
<table class="transaction-table">
<thead>
<tr>
<th>Type</th>
<th>Amount</th>
<th>Source / Place</th>
<th>Date</th>
</tr>
</thead>
<tbody id="transactionTable">
</tbody>

</table>
</div>
<hr style="width:100%;margin-top:30px">
<h2 class="content-header">Top Ausgaben Orte</h2>
<div id="expenseRanking"></div>
    </div>
    <div id="sidebar">

        <a class="navitem" id="navitem1">Home</a>
        <a class="navitem" id="navitem2">Dashboard</a>
        <a class="navitem" id="navitem3">Help</a>
        <a class="navitem" id="navitem4">Parentsite</a>


    </div>
   </div>
</main>
<script>
        function openLink(url) {
          let redirectConfirmation = confirm("Redirecting to '" + url + "'");
          if (redirectConfirmation === true) {
             window.open(url, "_blank");
        } else {
          alert("Redirect canceled!");
        }
        }
</script>
<script>
  const navItemEl1 = document.getElementById("navitem1");
  const navItemEl2 = document.getElementById("navitem2");
  const navItemEl3 = document.getElementById("navitem3");
  const navItemEl4 = document.getElementById("navitem4");

  navItemEl1.addEventListener("click", ()=> {
    openLink("budgettracker.html");
  });
  navItemEl2.addEventListener("click", ()=> {
    alert("Page already loaded!");
  });
  navItemEl3.addEventListener("click", ()=> {
    openLink("help.html");
  });
  navItemEl4.addEventListener("click", ()=> {
    openLink("index.html");
  });

  
</script>
<script>

let budget = Number(localStorage.getItem("budget")) || 0;
let transactions = JSON.parse(localStorage.getItem("transactions")) || [];

function save(){

localStorage.setItem("budget", budget);
localStorage.setItem("transactions", JSON.stringify(transactions));

}

function updateUI(){

let income = 0;
let expenses = 0;

transactions.forEach(t=>{

if(t.type === "income"){
income += t.amount;
}else{
expenses += t.amount;
}

});

document.getElementById("budgetDisplay").textContent = budget;
document.getElementById("incomeDisplay").textContent = income;
document.getElementById("expenseDisplay").textContent = expenses;

let remaining = budget + income - expenses;

document.getElementById("remainingDisplay").textContent = remaining;
document.getElementById("remainingDisplay2").textContent = remaining;

updateBalanceColor(remaining);
renderTransactions();
renderRanking();

}

function setBudget(){

budget = Number(document.getElementById("budgetInput").value);

save();
updateUI();

}

function addIncome(){

let amount = Number(document.getElementById("incomeInput").value);
let source = document.getElementById("incomeSource").value || "Unknown";

transactions.push({
type:"income",
amount:amount,
place:source,
date:new Date().toLocaleString()
});

save();
updateUI();

}

function addExpense(){

let amount = Number(document.getElementById("expenseInput").value);
let place = document.getElementById("expensePlace").value || "Unknown";

transactions.push({
type:"expense",
amount:amount,
place:place,
date:new Date().toLocaleString()
});

save();
updateUI();

}

function renderTransactions(){

let table = document.getElementById("transactionTable");

table.innerHTML = "";

transactions.slice().reverse().forEach(t=>{

let row = document.createElement("tr");

row.className = t.type === "income" ? "income-row" : "expense-row";

row.innerHTML = `
<td>${t.type}</td>
<td>${t.amount}€</td>
<td>${t.place}</td>
<td>${t.date}</td>
`;

table.appendChild(row);

});

}

function renderRanking(){

let ranking = {};

transactions.forEach(t=>{

if(t.type === "expense"){

if(!ranking[t.place]){
ranking[t.place] = 0;
}

ranking[t.place] += t.amount;

}

});

let sorted = Object.entries(ranking).sort((a,b)=>b[1]-a[1]);

let container = document.getElementById("expenseRanking");

container.innerHTML = "";

sorted.forEach((r,i)=>{

let div = document.createElement("div");

div.textContent = "#" + (i+1) + " • " + r[0] + " — " + r[1] + "€";

container.appendChild(div);

});

}

function resetBudget(){

if(confirm("Reset everything?")){

budget = 0;
transactions = [];

save();
updateUI();

}

}

updateUI();
function updateBalanceColor(remaining){

let card = document.getElementById("balanceCard");

let ratio = remaining / budget;

card.classList.remove("balance-green","balance-yellow","balance-red");

if(ratio > 0.6){

card.classList.add("balance-green");

}else if(ratio > 0.3){

card.classList.add("balance-yellow");

}else{

card.classList.add("balance-red");

}

}
</script>
</body>
</html>
