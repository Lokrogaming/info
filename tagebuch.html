function createFileSection(title, files, className) {
  if (!files) return "";

  let list = "";
  files.forEach(file => {
    list += `<li>${file}</li>`;
  });

  return `
    <p>${title}:</p>
    <div class="filecard ${className}">
      <ul class="no-dots">
        ${list}
      </ul>
    </div>
  `;
}

function loadTable() {
  const table = document.getElementById("GHCT");

  GHCList.forEach(commitObj => {

    const key = Object.keys(commitObj)[0];
    const data = commitObj[key];

    const details = document.createElement("details");

    const createdSection = createFileSection("Created", data.files.created, "created");
    const changedSection = createFileSection("Changed", data.files.changed, "changed");
    const deletedSection = createFileSection("Deleted", data.files.deleted, "deleted");

    details.innerHTML = `
      <summary>
        ${key} (${data.date})
      </summary>
      <a href="${data.link}" target="_blank">OPEN ON GITHUB :${key}</a>
      ${createdSection}
      ${changedSection}
      ${deletedSection}
        
        <p> SHA256-KEY: ${data.sha256}</p>
    
      `;

    table.appendChild(details);

  });
}
