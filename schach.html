<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="https://htmlhoster.lovable.app">
    <title>Chess Engine</title>
    
    <!-- Dependencies -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
 <!--- QUARANTINE  -->
<script src="https://lokro.dev/JS/modules/quarantineMode.js" defer></script>
<!------>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

    <style>
        @import "src/chess.css";
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div id="myBoard"></div>

        <div class="sidebar">
            <h1>Grandmaster</h1>
            
            <div class="info-panel">
                <div class="status-card">
                    <span class="label">Match Status</span>
                    <div id="status" class="value">Ready for battle</div>
                </div>

                <div class="status-card" style="border-left-color: #4581f5;">
                    <span class="label">AI Engine</span>
                    <div id="ai-status" class="value">Stockfish 10 (Web)</div>
                </div>
            </div>

            <div class="button-stack">
                <button id="resetBtn">New Game</button>
                <button id="undoBtn" class="secondary">Undo Move</button>
            </div>

            <div class="history-container">
                <span class="label">Move Log</span>
                <div class="pgn-display" id="pgn">Game start.</div>
            </div>
        </div>
    </div>

    <script>
        let board = null;
        let game = new Chess();
        let stockfish = null;
        const $status = $('#status');
        const $pgn = $('#pgn');
        const $aiStatus = $('#ai-status');

        function removeHighlights() {
            $('#myBoard .square-55d63').find('.highlight-dot, .highlight-ring').remove();
        }

        function addHighlights(source) {
            const moves = game.moves({
                square: source,
                verbose: true
            });

            if (moves.length === 0) return;

            moves.forEach(move => {
                const $square = $('#myBoard .square-' + move.to);
                if ($square.find('img').length > 0) {
                    $square.append('<div class="highlight-ring"></div>');
                } else {
                    $square.append('<div class="highlight-dot"></div>');
                }
            });
        }

        function initEngine() {
            try {
                fetch('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js')
                    .then(r => r.text())
                    .then(content => {
                        const blob = new Blob([content], { type: 'application/javascript' });
                        const workerUrl = URL.createObjectURL(blob);
                        stockfish = new Worker(workerUrl);
                        
                        stockfish.onmessage = function(event) {
                            const line = event.data;
                            if (line.startsWith('bestmove')) {
                                const match = line.match(/bestmove\s([a-h][1-8][a-h][1-8][qrbn]?)/);
                                if (match) {
                                    const bestMove = match[1];
                                    game.move({
                                        from: bestMove.substring(0, 2),
                                        to: bestMove.substring(2, 4),
                                        promotion: bestMove.substring(4, 5) || 'q'
                                    });
                                    board.position(game.fen());
                                    updateStatus();
                                    $aiStatus.text('Grandmaster ready');
                                }
                            }
                        };
                        stockfish.postMessage('uci');
                        stockfish.postMessage('isready');
                    });
            } catch (e) {
                $aiStatus.text('Engine Error');
            }
        }

        function onDragStart(source, piece, position, orientation) {
            if (game.game_over()) return false;
            if (piece.search(/^b/) !== -1) return false;
            addHighlights(source);
        }

        function getBestMove() {
            if (game.game_over()) return;
            if (stockfish) {
                $aiStatus.text('Thinking...');
                stockfish.postMessage(`position fen ${game.fen()}`);
                stockfish.postMessage('go depth 12');
            }
        }

        function onDrop(source, target) {
            removeHighlights();
            const move = game.move({
                from: source,
                to: target,
                promotion: 'q' 
            });
            if (move === null) return 'snapback';
            updateStatus();
            window.setTimeout(getBestMove, 250);
        }

        function onSnapEnd() {
            board.position(game.fen());
        }

        function onMouseoutSquare() {
            // Keep highlights during drag, but otherwise could clear here
        }

        function updateStatus() {
            let status = '';
            let moveColor = game.turn() === 'b' ? 'AI' : 'You';

            if (game.in_checkmate()) {
                status = `Checkmate! ${moveColor === 'You' ? 'AI wins' : 'You win!'}`;
            } else if (game.in_draw()) {
                status = 'Stalemate / Draw';
            } else {
                status = moveColor + ' to move';
                if (game.in_check()) status += ' (Check!)';
            }

            $status.html(status);
            $pgn.html(game.pgn() || 'Game started');
            $pgn.scrollTop($pgn[0].scrollHeight);
        }

        const boardConfig = {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        };

        $(document).ready(function() {
            board = Chessboard('myBoard', boardConfig);
            $(window).resize(board.resize);
            initEngine();
        });

        $('#resetBtn').on('click', function() {
            game.reset();
            board.start();
            removeHighlights();
            updateStatus();
        });

        $('#undoBtn').on('click', function() {
            game.undo(); // Undo AI
            game.undo(); // Undo User
            board.position(game.fen());
            removeHighlights();
            updateStatus();
        });
    </script>
</body>
</html>
