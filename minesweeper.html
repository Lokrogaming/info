<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="developer" content="https://htmlhoster.lovable.app">
    <title>Modern Minesweeper</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        @import "src/minesweeper.css";
    </style>
</head>
<body>
    <button class="home-btn" onclick="window.location.href='index.html'">Home</button>

    <div class="container">
        <h1>Minesweeper</h1> 
        <p>Made using HTMLHoster (made by me)</p><br>

        <div class="controls">
            <button onclick="startGame('easy')">Easy</button>
            <button onclick="startGame('medium')">Medium</button>
            <button onclick="startGame('hard')">Hard</button>
        </div>

        <div class="stats">
            <div>Mines: <span id="mine-count">0</span></div>
            <div>Time: <span id="timer">0</span>s</div>
        </div>

        <div id="grid" class="grid"></div>

        <div class="toggle-container" style="justify-content: center; margin-top: 20px;">
            <button id="flag-toggle" class="mode-btn" onclick="toggleFlagMode()">🚩 Flag Mode: OFF</button>
            <button class="secondary" onclick="resetGame()">Reset</button>
        </div>
    </div>

    <script>
        const gridElement = document.getElementById('grid');
        const mineCountDisplay = document.getElementById('mine-count');
        const timerDisplay = document.getElementById('timer');
        const flagToggleBtn = document.getElementById('flag-toggle');

        let width, height, mineCount;
        let cells = [];
        let isGameOver = false;
        let timer = 0;
        let timerId = null;
        let isFlagMode = false;
        let minesLeft = 0;

        const levels = {
            easy: { w: 9, h: 9, m: 10 },
            medium: { w: 16, h: 16, m: 40 },
            hard: { w: 30, h: 16, m: 99 }
        };

        let currentLevel = 'easy';

        function startGame(level) {
            currentLevel = level;
            const config = levels[level];
            width = config.w;
            height = config.h;
            mineCount = config.m;
            minesLeft = mineCount;
            resetGame();
        }

        function toggleFlagMode() {
            isFlagMode = !isFlagMode;
            flagToggleBtn.classList.toggle('active');
            flagToggleBtn.innerHTML = isFlagMode ? "🚩 Flag Mode: ON" : "🚩 Flag Mode: OFF";
        }

        function resetGame() {
            clearInterval(timerId);
            timer = 0;
            timerId = null;
            timerDisplay.innerText = 0;
            isGameOver = false;
            cells = [];
            gridElement.innerHTML = '';
            mineCountDisplay.innerText = minesLeft;
            
            gridElement.style.gridTemplateColumns = `repeat(${width}, 1fr)`;

            const minesArray = Array(mineCount).fill('mine');
            const emptyArray = Array(width * height - mineCount).fill('empty');
            const gameArray = emptyArray.concat(minesArray).sort(() => Math.random() - 0.5);

            for (let i = 0; i < width * height; i++) {
                const cell = document.createElement('div');
                cell.setAttribute('id', i);
                cell.classList.add('cell');
                cell.dataset.type = gameArray[i];
                
                cell.addEventListener('click', () => handleClick(i));
                cell.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    addFlag(i);
                });

                gridElement.appendChild(cell);
                cells.push(cell);
            }

            
            for (let i = 0; i < cells.length; i++) {
                let total = 0;
                const isLeftEdge = (i % width === 0);
                const isRightEdge = (i % width === width - 1);

                if (cells[i].dataset.type === 'empty') {
                    if (i > 0 && !isLeftEdge && cells[i - 1].dataset.type === 'mine') total++;
                    if (i > 9 && !isRightEdge && cells[i + 1 - width].dataset.type === 'mine') total++;
                    if (i > 10 && cells[i - width].dataset.type === 'mine') total++;
                    if (i > 11 && !isLeftEdge && cells[i - 1 - width].dataset.type === 'mine') total++;
                    if (i < (width * height - 2) && !isRightEdge && cells[i + 1].dataset.type === 'mine') total++;
                    if (i < (width * height - width) && !isLeftEdge && cells[i - 1 + width].dataset.type === 'mine') total++;
                    if (i < (width * height - width - 1) && !isRightEdge && cells[i + 1 + width].dataset.type === 'mine') total++;
                    if (i < (width * height - width) && cells[i + width].dataset.type === 'mine') total++;
                    cells[i].dataset.total = total;
                }
            }
        }

        function startTimer() {
            if (!timerId) {
                timerId = setInterval(() => {
                    timer++;
                    timerDisplay.innerText = timer;
                }, 1000);
            }
        }

        function handleClick(id) {
            if (isGameOver) return;
            if (cells[id].classList.contains('revealed') || cells[id].classList.contains('flag')) {
                if (isFlagMode) addFlag(id);
                return;
            }

            if (isFlagMode) {
                addFlag(id);
                return;
            }

            startTimer();

            if (cells[id].dataset.type === 'mine') {
                gameOver();
            } else {
                let total = cells[id].dataset.total;
                if (total != 0) {
                    cells[id].classList.add('revealed');
                    cells[id].classList.add('n' + total);
                    cells[id].innerHTML = total;
                } else {
                    revealEmpty(id);
                }
                cells[id].classList.add('revealed');
            }
            checkWin();
        }

        function addFlag(id) {
            if (isGameOver || cells[id].classList.contains('revealed')) return;
            
            if (!cells[id].classList.contains('flag')) {
                cells[id].classList.add('flag');
                cells[id].innerHTML = '🚩';
                minesLeft--;
            } else {
                cells[id].classList.remove('flag');
                cells[id].innerHTML = '';
                minesLeft++;
            }
            mineCountDisplay.innerText = minesLeft;
        }

        function revealEmpty(id) {
            const isLeftEdge = (id % width === 0);
            const isRightEdge = (id % width === width - 1);

            setTimeout(() => {
                const neighbors = [
                    { idx: id - 1, condition: !isLeftEdge },
                    { idx: id + 1, condition: !isRightEdge },
                    { idx: id - width, condition: id >= width },
                    { idx: id + width, condition: id < width * (height - 1) },
                    { idx: id - width - 1, condition: id >= width && !isLeftEdge },
                    { idx: id - width + 1, condition: id >= width && !isRightEdge },
                    { idx: id + width - 1, condition: id < width * (height - 1) && !isLeftEdge },
                    { idx: id + width + 1, condition: id < width * (height - 1) && !isRightEdge }
                ];

                neighbors.forEach(neighbor => {
                    if (neighbor.condition) {
                        const cell = cells[neighbor.idx];
                        if (!cell.classList.contains('revealed') && !cell.classList.contains('flag')) {
                            cell.classList.add('revealed');
                            const total = cell.dataset.total;
                            if (total != 0) {
                                cell.innerHTML = total;
                                cell.classList.add('n' + total);
                            } else {
                                revealEmpty(neighbor.idx);
                            }
                        }
                    }
                });
            }, 10);
        }

        function gameOver() {
            isGameOver = true;
            clearInterval(timerId);
            cells.forEach(cell => {
                if (cell.dataset.type === 'mine') {
                    cell.innerHTML = '💣';
                    cell.classList.add('mine');
                    cell.classList.remove('flag');
                }
            });
            alert('Game Over! Better luck next time.');
        }

        function checkWin() {
            let matches = 0;
            for (let i = 0; i < cells.length; i++) {
                if (cells[i].classList.contains('revealed') || (cells[i].dataset.type === 'mine' && cells[i].classList.contains('flag'))) {
                    matches++;
                }
            }
            if (matches === cells.length) {
                isGameOver = true;
                clearInterval(timerId);
                alert('Congratulations! You cleared the field!');
            }
        }

        
        startGame('medium');

    </script>
</body>
</html>
